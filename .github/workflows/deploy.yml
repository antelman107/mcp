# Deploys the linux binary to the Turkish host.
# Repository secrets:
#   TR_SSH_KEY  private key from ~/.ssh/tr
#   TR_SSH_USER SSH login
#   TR_SSH_PORT SSH port
name: Deploy antalyakart-mcp

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "deploy/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build linux binary
        working-directory: cmd/antalyakart-mcp
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o antalyakart-mcp .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TR_SSH_KEY }}
          SSH_PORT: ${{ secrets.TR_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/tr
          chmod 600 ~/.ssh/tr
          ssh-keyscan -p "$SSH_PORT" -H mcp.goturkey.club >> ~/.ssh/known_hosts

      - name: Upload and install
        env:
          SSH_USER: ${{ secrets.TR_SSH_USER }}
          SSH_PORT: ${{ secrets.TR_SSH_PORT }}
        run: |
          scp -i ~/.ssh/tr -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            ./cmd/antalyakart-mcp/antalyakart-mcp \
            ./deploy/antalyakart-mcp.service \
            ./deploy/Caddyfile \
            "${SSH_USER}@mcp.goturkey.club:~/"
          ssh -i ~/.ssh/tr -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "${SSH_USER}@mcp.goturkey.club" "bash -s -- $(printf '%q' "$SSH_USER")" <<'EOF'
          set -euo pipefail
          deploy_user=$1
          if ! command -v caddy >/dev/null 2>&1; then
            sudo dnf install -y dnf-plugins-core
            sudo dnf copr enable -y @caddy/caddy
            sudo dnf install -y caddy
          fi
          sudo mkdir -p /var/www/mcp /etc/caddy
          sudo mv ~/antalyakart-mcp /var/www/mcp/antalyakart-mcp
          sudo chmod 755 /var/www/mcp/antalyakart-mcp
          sudo chown "${deploy_user}:${deploy_user}" /var/www/mcp /var/www/mcp/antalyakart-mcp
          sed "s/__DEPLOY_USER__/${deploy_user}/g" ~/antalyakart-mcp.service | sudo tee /etc/systemd/system/antalyakart-mcp.service >/dev/null
          rm -f ~/antalyakart-mcp.service
          sudo mv ~/Caddyfile /etc/caddy/Caddyfile
          sudo firewall-cmd --permanent --add-service=http
          sudo firewall-cmd --permanent --add-service=https
          sudo firewall-cmd --reload
          sudo systemctl daemon-reload
          sudo systemctl enable antalyakart-mcp caddy
          sudo systemctl restart antalyakart-mcp
          sudo systemctl restart caddy
          curl -fsS http://127.0.0.1:8090/healthz
          EOF
